<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Teracopia Pulse</title>
<style>
  :root {
    --bg: #eef1f7;
    --card: #ffffff;
    --fg: #16192b;
    --muted: #7a7f99;
    --border: #e6e8f1;
    --grid-line: #eceef6;
    --accent: #3b6ef6;
    --accent-soft: #eaf0ff;
    --accent2: #16b3a3;
    --accent2-soft: #e4f8f5;
    --warn: #e08a1e;
    --warn-soft: #fdf1df;
    --good: #19b366;
    --good-soft: #e2f7eb;
    --bad: #e5484d;
    --bad-soft: #fde5e6;
    --neutral: #8d93ac;
    --neutral-soft: #eef0f6;
    --yt: #e23f3f;
    --yt-soft: #fdeaea;
    --shadow: 0 1px 2px rgba(22,25,43,0.04), 0 6px 18px -10px rgba(22,25,43,0.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1120;
      --card: #171b30;
      --fg: #eef0fb;
      --muted: #8d93bb;
      --border: #272c4d;
      --grid-line: #232749;
      --accent: #6d8dff;
      --accent-soft: #1d2748;
      --accent2: #3fd9c7;
      --accent2-soft: #10322e;
      --warn: #e8a83f;
      --warn-soft: #332814;
      --good: #4fd98b;
      --good-soft: #10301f;
      --bad: #ff6b72;
      --bad-soft: #3a191b;
      --neutral: #9aa0c2;
      --neutral-soft: #1c2038;
      --yt: #ff6b6b;
      --yt-soft: #391819;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px -10px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    padding-inline: 22px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex;
  }
  main { width: 100%; max-width: 1560px; margin: 0 auto; display: flex; flex-direction: column; min-height: calc(100vh - 34px); }
  .num, .big-num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  header.page {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    flex: none;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent2)); flex: none; }
  .brand h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .brand .sub { font-size: 12.5px; color: var(--muted); margin-top: 0; }
  .header-right { display: flex; align-items: center; gap: 12px; }

  .period-group { display: flex; gap: 3px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px; box-shadow: var(--shadow); }
  .period-btn { font-family: inherit; border: none; background: none; font-size: 13.5px; color: var(--muted); padding: 7px 15px; border-radius: 7px; cursor: pointer; font-weight: 500; }
  .period-btn.active { background: var(--accent); color: #fff; font-weight: 600; }

  #refresh-btn {
    font-family: inherit; background: var(--card); color: var(--fg); border: 1px solid var(--border);
    border-radius: 9px; padding: 8px 15px; font-size: 13.5px; cursor: pointer; box-shadow: var(--shadow);
  }
  #refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  #refresh-btn:disabled { opacity: 0.55; cursor: default; }
  .timestamp { font-size: 12.5px; color: var(--muted); }

  .period-caption { font-size: 13px; color: var(--muted); margin: -6px 0 16px; flex: none; }

  /* ---- Dashboard grid: stat tiles + chart panels + full-width panel ---- */
  .dash-grid {
    display: grid;
    grid-template-columns: 280px 1fr 1fr;
    grid-template-rows: 1fr 1fr auto;
    grid-template-areas:
      "stat1 panelA panelB"
      "stat2 panelA panelB"
      "full  full   full";
    gap: 16px;
    margin-bottom: 16px;
    flex: 1;
    min-height: 0;
  }
  #card-youtube  { grid-area: stat1; }
  #card-bookings { grid-area: stat2; }
  #card-web      { grid-area: panelA; }
  #card-email    { grid-area: panelB; }
  #card-revenue  { grid-area: full; min-height: 280px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 22px 24px;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* -- stat tiles (no chart; number + delta + caption) -- */
  .stat-card { justify-content: center; }
  .stat-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .cat-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cat, var(--accent)); flex: none; }
  .stat-head .t { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-card .big-num { font-size: 44px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.05; color: var(--cat, var(--fg)); }
  .delta { font-weight: 700; display: inline-flex; align-items: center; gap: 3px; font-size: 13.5px; margin-top: 8px; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--bad); }
  .delta.flat { color: var(--muted); }
  .stat-caption { font-size: 12.5px; color: var(--muted); margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--border); }

  /* -- chart panels -- */
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; flex: none; }
  .panel-title { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 700; }
  .panel-badge { font-size: 12.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .panel-badge b { color: var(--fg); font-weight: 700; }
  .panel-badge .up { color: var(--good); }
  .panel-badge .down { color: var(--bad); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  .chart-wrap { flex: 1; min-height: 160px; margin-top: 10px; }
  #card-revenue .chart-wrap { min-height: 190px; }
  svg.chart { width: 100%; height: 100%; display: block; overflow: visible; }
  .axis-label { font-size: 9.5px; fill: var(--muted); font-family: "Inter", system-ui, sans-serif; }
  .grid-line { stroke: var(--grid-line); stroke-width: 1; }

  .insight-line { font-size: 12.5px; color: var(--muted); margin-top: 10px; flex: none; }
  .insight-line b { color: var(--fg); }

  .error-note { font-size: 13px; color: var(--bad); background: var(--bad-soft); border: 1px solid var(--bad); border-radius: 9px; padding: 9px 12px; }

  footer.page { text-align: center; font-size: 11.5px; color: var(--muted); padding-top: 14px; flex: none; }

  @media (max-width: 1000px) {
    .dash-grid {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto auto;
      grid-template-areas:
        "stat1 stat2"
        "panelA panelB"
        "full full";
    }
    .chart-wrap { min-height: 200px; }
  }
  @media (max-width: 640px) {
    main { min-height: 0; }
    .dash-grid {
      grid-template-columns: 1fr;
      grid-template-areas:
        "stat1"
        "stat2"
        "panelA"
        "panelB"
        "full";
      flex: none;
    }
    .chart-wrap { min-height: 180px; }
    .header-right { width: 100%; justify-content: space-between; flex-wrap: wrap; row-gap: 8px; }
    .timestamp { flex-basis: 100%; order: 3; }
    .panel-head { flex-wrap: wrap; row-gap: 6px; }
    .panel-head > div[style] { width: 100%; justify-content: space-between; flex-wrap: wrap; row-gap: 6px; }
    .legend { gap: 10px; }
    .panel-badge { white-space: normal; }
  }
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<main>
  <header class="page">
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1>Teracopia Pulse</h1>
        <div class="sub">Private accountability dashboard</div>
      </div>
    </div>
    <div class="header-right">
      <div class="period-group" id="period-group">
        <button class="period-btn" data-period="day" type="button">Day</button>
        <button class="period-btn" data-period="week" type="button">Week</button>
        <button class="period-btn active" data-period="month" type="button">Month</button>
        <button class="period-btn" data-period="year" type="button">Year</button>
      </div>
      <span class="timestamp" id="updated-at">loading…</span>
      <button id="refresh-btn" type="button">Refresh</button>
    </div>
  </header>

  <div class="period-caption" id="period-caption"></div>

  <div class="dash-grid" id="dash-grid">
    <!-- YouTube — stat tile -->
    <div class="card stat-card" id="card-youtube" style="--cat:var(--yt)">
      <div class="stat-head"><span class="cat-dot"></span><span class="t">YouTube Subscribers</span></div>
      <div class="big-num" id="youtube-num">—</div>
      <div id="youtube-delta"></div>
      <div class="stat-caption" id="youtube-caption">—</div>
    </div>

    <!-- Bookings — stat tile -->
    <div class="card stat-card" id="card-bookings" style="--cat:var(--accent2)">
      <div class="stat-head"><span class="cat-dot"></span><span class="t">Bookings (Cal.com)</span></div>
      <div class="big-num" id="bookings-num">—</div>
      <div id="bookings-delta"></div>
      <div class="stat-caption" id="bookings-caption">—</div>
    </div>

    <!-- Web Traffic — line/area chart panel -->
    <div class="card" id="card-web" style="--cat:var(--good)">
      <div class="panel-head">
        <div class="panel-title"><span class="cat-dot"></span><span>Website Visitors</span></div>
        <span class="panel-badge" id="web-badge">—</span>
      </div>
      <div class="chart-wrap"><svg class="chart" id="web-chart" viewBox="0 0 640 230" preserveAspectRatio="none"></svg></div>
      <div class="insight-line" id="web-insight"></div>
    </div>

    <!-- Email List — bar chart panel -->
    <div class="card" id="card-email" style="--cat:var(--warn)">
      <div class="panel-head">
        <div class="panel-title"><span class="cat-dot"></span><span>New Email Subscribers</span></div>
        <span class="panel-badge" id="email-badge">—</span>
      </div>
      <div class="chart-wrap"><svg class="chart" id="email-chart" viewBox="0 0 640 230" preserveAspectRatio="none"></svg></div>
      <div class="insight-line" id="email-insight"></div>
    </div>

    <!-- Revenue — full-width dual-area chart panel -->
    <div class="card" id="card-revenue" style="--cat:var(--accent)">
      <div class="panel-head">
        <div class="panel-title"><span class="cat-dot"></span><span>Revenue — Book vs. Coaching</span></div>
        <div style="display:flex; align-items:center; gap:18px;">
          <span class="legend">
            <span><i style="background:var(--accent)"></i>Book</span>
            <span><i style="background:var(--accent2)"></i>Coaching</span>
          </span>
          <span class="panel-badge" id="revenue-badge">—</span>
        </div>
      </div>
      <div class="chart-wrap"><svg class="chart" id="revenue-chart" viewBox="0 0 1200 230" preserveAspectRatio="none"></svg></div>
      <div class="insight-line" id="revenue-insight"></div>
    </div>
  </div>

  <footer class="page">Private — unlisted page, blocked from search indexing</footer>
</main>

<script>
(() => {
  const ENDPOINT = "/api/dashboard";
  const TOKEN = "gp5c4QlFdT9EhmdzIZ9uZRrPiATqOv866oFbBZ3C6Jc";

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => (n === null || n === undefined || Number.isNaN(n)) ? "—" : new Intl.NumberFormat("en-US").format(n);
  const fmtMoney = (n) => (n === null || n === undefined || Number.isNaN(n)) ? "—" : "$" + new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);

  function fmtLabel(key, granularity) {
    if (granularity === "month") {
      const [y, m] = key.split("-");
      return new Date(Date.UTC(Number(y), Number(m) - 1, 1)).toLocaleDateString("en-US", { month: "short", timeZone: "UTC" });
    }
    const d = new Date(key + "T00:00:00Z");
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  }

  // ---- Period config -------------------------------------------------
  const PERIODS = {
    day:   { days: 1,   granularity: "day",   buckets: 14, caption: "Today vs. yesterday — chart: last 14 days" },
    week:  { days: 7,   granularity: "day",   buckets: 14, caption: "Last 7 days vs. the 7 before — chart: last 14 days, daily" },
    month: { days: 30,  granularity: "week",  buckets: 12, caption: "Last 30 days vs. the 30 before — chart: last 12 weeks" },
    year:  { days: 365, granularity: "month", buckets: 12, caption: "Last 365 days vs. the year before — chart: last 12 months" },
  };
  let activePeriod = "month";

  // ---- Generic daily-array aggregation -------------------------------
  function weekKeyOf(dateStr) {
    const d = new Date(dateStr + "T00:00:00Z");
    const day = d.getUTCDay();
    d.setUTCDate(d.getUTCDate() - day);
    return d.toISOString().slice(0, 10);
  }
  function monthKeyOf(dateStr) { return dateStr.slice(0, 7); }

  function bucketKey(dateStr, granularity) {
    if (granularity === "week") return weekKeyOf(dateStr);
    if (granularity === "month") return monthKeyOf(dateStr);
    return dateStr;
  }

  function aggregate(daily, granularity, valueFn) {
    const map = new Map();
    for (const d of daily || []) {
      const k = bucketKey(d.date, granularity);
      map.set(k, (map.get(k) || 0) + valueFn(d));
    }
    return [...map.entries()].map(([key, value]) => ({ key, value })).sort((a, b) => a.key.localeCompare(b.key));
  }

  function cutoffKey(daysAgo) {
    const d = new Date();
    d.setUTCDate(d.getUTCDate() - daysAgo);
    return d.toISOString().slice(0, 10);
  }

  function sumWindow(daily, days, valueFn) {
    const c = cutoffKey(days);
    return (daily || []).filter((d) => d.date >= c).reduce((s, d) => s + valueFn(d), 0);
  }

  function sumPrevWindow(daily, days, valueFn) {
    const end = cutoffKey(days);
    const start = cutoffKey(days * 2);
    return (daily || []).filter((d) => d.date >= start && d.date < end).reduce((s, d) => s + valueFn(d), 0);
  }

  function pctChange(curr, prev) {
    if (!prev) return null;
    return ((curr - prev) / prev) * 100;
  }

  function deltaHTML(curr, prev, periodLabel) {
    const pct = pctChange(curr, prev);
    const suffix = periodLabel ? ` ${periodLabel}` : "";
    if (pct === null) return `<div class="delta flat">—${suffix}</div>`;
    const up = pct >= 0;
    return `<div class="delta ${up ? "up" : "down"}">${up ? "▲" : "▼"} ${Math.abs(pct).toFixed(0)}%${suffix}</div>`;
  }

  function badgeHTML(curr, prev, label, fmtFn) {
    const pct = pctChange(curr, prev);
    const valueText = `<b>${fmtFn(curr)}</b> ${label}`;
    if (pct === null) return valueText;
    const up = pct >= 0;
    return `${valueText} <span class="${up ? "up" : "down"}">${up ? "▲" : "▼"} ${Math.abs(pct).toFixed(0)}%</span>`;
  }

  // ---- SVG chart helpers ----------------------------------------------
  function svgEl(tag, attrs) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  // Shared axis layout: reserves space at left for y-axis labels and
  // at bottom for x-axis labels, draws horizontal gridlines + y labels.
  function axisLayout(svg, maxValue) {
    const vb = svg.getAttribute("viewBox").split(" ").map(Number);
    const W = vb[2], H = vb[3];
    const padLeft = 38, padBottom = 22, padTop = 6, padRight = 4;
    const plotW = W - padLeft - padRight;
    const plotH = H - padTop - padBottom;
    svg.innerHTML = "";

    const rows = 4;
    const niceMax = Math.max(1, maxValue);
    for (let i = 0; i <= rows; i++) {
      const y = padTop + (plotH * i) / rows;
      svg.appendChild(svgEl("line", { x1: padLeft, y1: y, x2: W - padRight, y2: y, class: "grid-line" }));
      const val = Math.round(niceMax * (1 - i / rows));
      const t = svgEl("text", { x: padLeft - 8, y: y + 3, "text-anchor": "end", class: "axis-label" });
      t.textContent = fmt(val);
      svg.appendChild(t);
    }

    return { W, H, padLeft, padRight, padTop, padBottom, plotW, plotH };
  }

  function drawXLabels(svg, labels, xForIndex, layout) {
    const skip = labels.length > 9 ? Math.ceil(labels.length / 9) : 1;
    labels.forEach((label, i) => {
      if (i % skip !== 0 && i !== labels.length - 1) return;
      const t = svgEl("text", { x: xForIndex(i), y: layout.H - 4, "text-anchor": "middle", class: "axis-label" });
      t.textContent = label;
      svg.appendChild(t);
    });
  }

  function noData(svg) {
    const vb = svg.getAttribute("viewBox").split(" ").map(Number);
    svg.innerHTML = "";
    const t = svgEl("text", { x: vb[2] / 2, y: vb[3] / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 12 });
    t.textContent = "No data yet";
    svg.appendChild(t);
  }

  function drawAxisBarChart(svg, values, labels, color) {
    if (!labels.length) return noData(svg);
    const max = Math.max(1, ...values);
    const layout = axisLayout(svg, max);
    const n = labels.length;
    const gap = layout.plotW / n;
    const barW = Math.max(3, gap * 0.55);
    const xForIndex = (i) => layout.padLeft + gap * i + gap / 2;

    values.forEach((v, i) => {
      const h = (v / max) * layout.plotH;
      const x = xForIndex(i) - barW / 2;
      const y = layout.padTop + layout.plotH - h;
      if (h > 0) svg.appendChild(svgEl("rect", { x, y, width: barW, height: h, fill: color, rx: 2 }));
    });

    drawXLabels(svg, labels, xForIndex, layout);
  }

  function drawAxisLineChart(svg, values, labels, color) {
    if (!labels.length) return noData(svg);
    const max = Math.max(1, ...values);
    const layout = axisLayout(svg, max);
    const n = values.length;
    const step = n > 1 ? layout.plotW / (n - 1) : 0;
    const xForIndex = (i) => layout.padLeft + step * i;
    const yForValue = (v) => layout.padTop + layout.plotH - (v / max) * layout.plotH;

    const pts = values.map((v, i) => [xForIndex(i), yForValue(v)]);
    const line = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    const area = line + ` L${pts[pts.length - 1][0].toFixed(1)},${layout.padTop + layout.plotH} L${pts[0][0].toFixed(1)},${layout.padTop + layout.plotH} Z`;

    const gradId = "grad-" + Math.random().toString(36).slice(2, 8);
    const defs = svgEl("defs", {});
    const grad = svgEl("linearGradient", { id: gradId, x1: 0, y1: 0, x2: 0, y2: 1 });
    grad.appendChild(svgEl("stop", { offset: "0%", "stop-color": color, "stop-opacity": 0.3 }));
    grad.appendChild(svgEl("stop", { offset: "100%", "stop-color": color, "stop-opacity": 0.02 }));
    defs.appendChild(grad);
    svg.appendChild(defs);

    svg.appendChild(svgEl("path", { d: area, fill: `url(#${gradId})` }));
    svg.appendChild(svgEl("path", { d: line, fill: "none", stroke: color, "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    pts.forEach(([cx, cy]) => svg.appendChild(svgEl("circle", { cx, cy, r: 2.5, fill: color })));

    drawXLabels(svg, labels, xForIndex, layout);
  }

  // Two overlapping (not stacked) translucent area series sharing one scale.
  function drawDualAreaChart(svg, seriesA, seriesB, labels) {
    if (!labels.length) return noData(svg);
    const max = Math.max(1, ...seriesA.values, ...seriesB.values);
    const layout = axisLayout(svg, max);
    const n = labels.length;
    const step = n > 1 ? layout.plotW / (n - 1) : 0;
    const xForIndex = (i) => layout.padLeft + step * i;
    const yForValue = (v) => layout.padTop + layout.plotH - (v / max) * layout.plotH;

    [seriesA, seriesB].forEach((series) => {
      const pts = series.values.map((v, i) => [xForIndex(i), yForValue(v)]);
      const line = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
      const area = line + ` L${pts[pts.length - 1][0].toFixed(1)},${layout.padTop + layout.plotH} L${pts[0][0].toFixed(1)},${layout.padTop + layout.plotH} Z`;
      svg.appendChild(svgEl("path", { d: area, fill: series.color, "fill-opacity": 0.22 }));
      svg.appendChild(svgEl("path", { d: line, fill: "none", stroke: series.color, "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    });

    drawXLabels(svg, labels, xForIndex, layout);
  }

  // ---- Render ----------------------------------------------------------
  let FULL_DATA = null;
  const periodWord = (cfg) => cfg.days === 1 ? "today" : cfg.days === 7 ? "this week" : cfg.days === 30 ? "this month" : "this year";

  function bucketed(daily, valueFn) {
    const cfg = PERIODS[activePeriod];
    const rows = aggregate(daily, cfg.granularity, valueFn).slice(-cfg.buckets);
    return { labels: rows.map((r) => fmtLabel(r.key, cfg.granularity)), values: rows.map((r) => r.value) };
  }

  function render(data) {
    FULL_DATA = data;
    const cfg = PERIODS[activePeriod];
    $("period-caption").textContent = cfg.caption;

    renderRevenue(data.stripe || {}, cfg);
    renderBookings(data.calcom || {}, cfg);
    renderEmail(data.mailerlite || {}, cfg);
    renderWeb(data.cloudflareAnalytics || {}, cfg);
    renderYoutube(data.youtube || {}, cfg);
  }

  function statError(prefix, msg) {
    $(`${prefix}-num`).textContent = "";
    $(`${prefix}-delta`).innerHTML = `<div class="error-note">${msg}</div>`;
    $(`${prefix}-caption`).textContent = "";
  }
  function panelError(prefix, msg) {
    $(`${prefix}-badge`).innerHTML = "";
    $(`${prefix}-chart`).innerHTML = "";
    $(`${prefix}-insight`).innerHTML = `<span class="error-note">${msg}</span>`;
  }

  function renderRevenue(stripe, cfg) {
    if (stripe.error) return panelError("revenue", stripe.error);
    const rev = (d) => (d.revenueBook || 0) + (d.revenueCoaching || 0);
    const curr = sumWindow(stripe.daily, cfg.days, rev);
    const prev = sumPrevWindow(stripe.daily, cfg.days, rev);

    $("revenue-badge").innerHTML = badgeHTML(curr, prev, periodWord(cfg), fmtMoney);
    const b = bucketed(stripe.daily, (d) => d.revenueBook || 0);
    const c = bucketed(stripe.daily, (d) => d.revenueCoaching || 0);
    drawDualAreaChart(
      $("revenue-chart"),
      { values: b.values, color: "var(--accent)" },
      { values: c.values, color: "var(--accent2)" },
      b.labels
    );

    const windowCut = cutoffKey(cfg.days);
    const best = (stripe.daily || [])
      .filter((d) => d.date >= windowCut)
      .map((d) => ({ date: d.date, revenue: (d.revenueBook || 0) + (d.revenueCoaching || 0) }))
      .filter((d) => d.revenue > 0)
      .sort((a, b2) => b2.revenue - a.revenue)[0];
    $("revenue-insight").innerHTML = best
      ? `Best day ${periodWord(cfg)}: <b>${fmtLabel(best.date, "day")} · ${fmtMoney(best.revenue)}</b>`
      : `No sales yet ${periodWord(cfg)}`;
  }

  function renderBookings(calcom, cfg) {
    if (calcom.error) return statError("bookings", calcom.error);
    const curr = sumWindow(calcom.daily, cfg.days, (d) => d.count || 0);
    const prev = sumPrevWindow(calcom.daily, cfg.days, (d) => d.count || 0);
    const completionRate = calcom.totalBooked ? Math.round((calcom.completed / calcom.totalBooked) * 100) : null;

    $("bookings-num").textContent = fmt(curr);
    $("bookings-delta").innerHTML = deltaHTML(curr, prev, "vs prior period");
    $("bookings-caption").innerHTML =
      `${fmt(calcom.completed)} completed · ${completionRate === null ? "—" : completionRate + "%"} rate · ${fmt(calcom.upcoming)} upcoming`;
  }

  function renderEmail(mail, cfg) {
    if (mail.error) return panelError("email", mail.error);
    const newSubs = sumWindow(mail.newSubscribersDaily, cfg.days, (d) => d.count || 0);
    const prevSubs = sumPrevWindow(mail.newSubscribersDaily, cfg.days, (d) => d.count || 0);
    const emailsSent = sumWindow(mail.emailsSentDaily, cfg.days, (d) => d.count || 0);

    $("email-badge").innerHTML = badgeHTML(mail.totalActiveSubscribers, null, "total subscribers", fmt);
    const b = bucketed(mail.newSubscribersDaily, (d) => d.count || 0);
    drawAxisBarChart($("email-chart"), b.values, b.labels, "var(--warn)");
    $("email-insight").innerHTML = `<b>${fmt(newSubs)}</b> new subscribers and <b>${fmt(emailsSent)}</b> emails sent ${periodWord(cfg)}`;
  }

  function renderWeb(web, cfg) {
    if (web.error) return panelError("web", web.error);
    const visitors = sumWindow(web.daily, cfg.days, (d) => d.uniqueVisitors || 0);
    const prevVisitors = sumPrevWindow(web.daily, cfg.days, (d) => d.uniqueVisitors || 0);
    const pageViews = sumWindow(web.daily, cfg.days, (d) => d.pageViews || 0);

    $("web-badge").innerHTML = badgeHTML(visitors, prevVisitors, periodWord(cfg), fmt);
    const b = bucketed(web.daily, (d) => d.uniqueVisitors || 0);
    drawAxisLineChart($("web-chart"), b.values, b.labels, "var(--good)");
    $("web-insight").innerHTML = `<b>${fmt(pageViews)}</b> page views · ${visitors ? (pageViews / visitors).toFixed(1) : "—"} per visit`;
  }

  function renderYoutube(yt, cfg) {
    if (yt.error) return statError("youtube", yt.error);
    const viewsThis = sumWindow(yt.daily, cfg.days, (d) => d.views || 0);
    const viewsPrev = sumPrevWindow(yt.daily, cfg.days, (d) => d.views || 0);

    $("youtube-num").textContent = fmt(yt.subscriberCount);
    $("youtube-delta").innerHTML = deltaHTML(viewsThis, viewsPrev, "views vs prior");
    $("youtube-caption").innerHTML = yt.latestVideo
      ? `${fmt(yt.totalViews)} lifetime views · ${fmt(yt.videoCount)} videos<br>Latest: <b>${yt.latestVideo.title}</b>`
      : `${fmt(yt.totalViews)} lifetime views · ${fmt(yt.videoCount)} videos`;
  }

  async function load() {
    const btn = $("refresh-btn");
    btn.disabled = true;
    btn.textContent = "Refreshing…";
    $("updated-at").textContent = "loading…";
    try {
      const res = await fetch(ENDPOINT, { headers: { "X-Dashboard-Token": TOKEN } });
      if (!res.ok) throw new Error(`Dashboard API returned ${res.status}`);
      const data = await res.json();
      render(data);
      $("updated-at").textContent = "Updated " + new Date(data.generatedAt).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    } catch (err) {
      $("updated-at").textContent = "Failed to load";
      const msg = String(err.message || err);
      statError("youtube", msg);
      statError("bookings", msg);
      panelError("email", msg);
      panelError("web", msg);
      panelError("revenue", msg);
    } finally {
      btn.disabled = false;
      btn.textContent = "Refresh";
    }
  }

  document.querySelectorAll(".period-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".period-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      activePeriod = btn.dataset.period;
      if (FULL_DATA) render(FULL_DATA);
    });
  });
  $("refresh-btn").addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
