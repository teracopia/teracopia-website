<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="https://teracopia.com/404.html">
<title>Page Not Found — Teracopia</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#102EA0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=Jost:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .notfound { padding: 120px 0; text-align: center; }
  .notfound .eyebrow { display: block; margin-bottom: 18px; }
  .notfound h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); }
  .notfound p { margin: 20px auto 36px; max-width: 32em; color: var(--ink-soft); font-size: 1.1rem; }
  .notfound-mark { width: 90px; height: 90px; margin: 0 auto 32px; }
</style>
</head>
<body>

{{NAV:none}}

<section class="notfound wrap">
  <span class="eyebrow">404</span>
  <svg class="notfound-mark" viewBox="-50 -50 260 260" xmlns="http://www.w3.org/2000/svg">
    <path d="M 80,20 Q 94.3,71.8 132,110 Q 80,96.5 28,110 Q 65.7,71.8 80,20 Z"
      stroke="#102EA0" stroke-width="8" fill="#FFFFFF" stroke-linejoin="miter" stroke-linecap="butt"/>
    <circle cx="80" cy="80" r="17.75" stroke="#102EA0" stroke-width="5" fill="#FFFFFF"/>
  </svg>
  <h1>This page drifted off.</h1>
  <p>The page you're looking for doesn't exist, or it moved somewhere else in the dream. Let's get you back on track.</p>
  <div class="cta-buttons">
    <a class="btn btn-outline-dark" href="/faq.html">Visit the FAQ</a>
    <a class="btn btn-primary" href="/">Back to Home</a>
  </div>
</section>

{{FOOTER}}

<script src="/assets/nav.js" defer></script>
</body>
</html>
